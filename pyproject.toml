[project]
name = "yb-observability"
version = "0.2.2"
description = "Reusable Python infrastructure for application configuration and observability."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
authors = [
    { name = "Yassine Bouali" },
]

keywords = [
    "configuration",
    "logging",
    "observability",
    "python",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Logging",
]
dependencies = [
    "loguru>=0.7.3,<1.0.0",
    "pyyaml>=6.0,<7.0",
]

[project.urls]
Homepage = "https://github.com/Ybouali/yb-observability"
Repository = "https://github.com/Ybouali/yb-observability"
Issues = "https://github.com/Ybouali/yb-observability/issues"
Changelog = "https://github.com/Ybouali/yb-observability/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pyright>=1.1.414,<2.0.0",
    "pytest>=9.1.1,<10.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
    "ruff>=0.16.7,<1.0.0",
]

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yb_observability = ["py.typed"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"