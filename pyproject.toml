[project]
name = "yb-observability"
version = "0.1.0"
description = "Reusable Python infrastructure for application configuration and observability."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { file = "LICENSE" }
authors = [
    { name = "Yassine Bouali" },
]
dependencies = [
    "loguru>=0.7.3,<1.0.0",
    "pyyaml>=6.0,<7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yb_observability"]

[dependency-groups]
dev = [
    "pyright>=1.1.411,<2.0.0",
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.24,<2.0",
    "ruff>=0.12,<1.0",
]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "C4",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"